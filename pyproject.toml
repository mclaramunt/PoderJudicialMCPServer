[project]
name = "poder-judicial-mcp"
version = "0.1.0"
description = "MCP server for searching and retrieving Spanish court judgments from poderjudicial.es"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "cendoj",
    "poder-judicial",
    "jurisprudencia",
    "sentencias",
    "legal",
    "legaltech",
    "spain",
    "claude",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: Spanish",
    "Natural Language :: English",
    "Intended Audience :: Legal Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beautifulsoup4>=4.13.4",
    "mcp[cli]>=1.9.2",
    "pdfminer-six>=20250506",
    "requests>=2.32.3",
]

[project.urls]
Homepage = "https://github.com/mclaramunt/PoderJudicialMCPServer"
Issues = "https://github.com/mclaramunt/PoderJudicialMCPServer/issues"

[project.scripts]
poder-judicial-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "services"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
